    <div class="container">
        //Visibility
        <section>
            <h2>Task 2: Hide, Show, Toggle</h2>
            <p id="text-visibility">This is a paragraph to show/hide.</p>
            <button id="btn-hide">Hide</button>
            <button id="btn-show">Show</button>
            <button id="btn-toggle">Toggle</button>
        </section>

        //Fade Methods
        <section>
            <h2>Task 3: Fade Methods</h2>
            <img id="img-fade" src="https://via.placeholder.com/150" alt="Placeholder">
            <br>
            <button id="btn-fade-in">Fade In</button>
            <button id="btn-fade-out">Fade Out</button>
            <button id="btn-fade-toggle">Fade Toggle</button>
        </section>

        //Slide Methods
        <section>
            <h2>Task 4: Slide Methods</h2>
            <button id="btn-slide-toggle">Panel Toggle</button>
            <div id="panel" style="background:#e0e0e0; padding:15px; margin-top:10px;">
            </div>
        </section>
    </div>
